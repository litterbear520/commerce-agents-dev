[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopping-agent-runtime"
version = "0.1.0.dev0"
description = "购物 agent 在 Messages API 上的轮次循环。"
requires-python = ">=3.11"
dependencies = [
  "commerce-common==0.1.0.dev0",
  "shopping-agent-core==0.1.0.dev0",
  "anthropic>=0.91",
]

[tool.hatch.build.targets.wheel]
packages = ["shopping_agent_runtime"]
